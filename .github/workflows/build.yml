# Compile Épure et lance les tests à chaque envoi de code.
# L'APK est téléchargeable dans l'onglet « Actions » de GitHub (section « Artifacts »).
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Facultatif : clé de signature stockée dans les secrets du dépôt
      # (Settings › Secrets and variables › Actions). Sans elle, l'APK est signé
      # avec une clé de test et ne peut pas mettre à jour une version déjà installée.
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v5

      - name: Préparer la signature
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/epure-release.jks
          printf 'storeFile=keystore/epure-release.jks\nstorePassword=%s\nkeyAlias=epure\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > keystore.properties

      - name: Tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Compiler les APK (launcher + module de notifications)
        run: ./gradlew :app:assembleRelease :notifications:assembleRelease

      - name: Publier l'APK du launcher
        uses: actions/upload-artifact@v5
        with:
          name: epure-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publier l'APK du module de notifications
        uses: actions/upload-artifact@v5
        with:
          name: epure-notifications-apk
          path: notifications/build/outputs/apk/release/*.apk
          if-no-files-found: error
